<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda Token</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }#main {
        background-image: url('bg.jpg');
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: background-image 0.5s ease-in-out;
    }

    #content {
        background-color: rgba(0, 0, 0, 0.7);
        padding: 30px;
        border-radius: 12px;
        max-width: 90%;
    }

    select {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 10px;
        border-radius: 6px;
        font-size: 16px;
    }

    a {
        color: #00cfff;
        text-decoration: none;
    }

    .hidden {
        display: none;
    }
</style>

</head><body>
    <select id="menu" onchange="navigate()">
        <option value="home">Меню</option>
        <option value="whitepaper">Бяла книга</option>
        <option value="contact">Контакт</option>
    </select><div id="main">
    <div id="homeContent" class="content-block">
        <img src="лого.png" alt="Лого на Андромеда" style="max-width: 250px;">
        <h1 style="margin-top: 20px; font-size: 40px;">ANDROMEDA</h1>
        <p style="font-size: 20px;">The future is in your hands.</p>
    </div>

    <div id="whitepaperContent" class="content-block hidden">
        <h2>Бяла книга</h2>
        <p><a href="Андромеда_Бяла книга.pdf" target="_blank">Изтеглете PDF</a></p>
        <button onclick="goBack()">Назад</button>
    </div>

    <div id="contactContent" class="content-block hidden">
        <h2>Контакт</h2>
        <p>andromedatoken01@gmail.com</p>
        <button onclick="goBack()">Назад</button>
    </div>
</div>

<script>
    function navigate() {
        const value = document.getElementById("menu").value;
        document.querySelectorAll(".content-block").forEach(block => block.classList.add("hidden"));

        switch (value) {
            case "whitepaper":
                document.getElementById("main").style.backgroundImage = "url('file_0000000028f062469cd3d821e509e640.png')";
                document.getElementById("whitepaperContent").classList.remove("hidden");
                break;
            case "contact":
                document.getElementById("main").style.backgroundImage = "url('file_0000000028f062469cd3d821e509e640.png')";
                document.getElementById("contactContent").classList.remove("hidden");
                break;
            default:
                document.getElementById("main").style.backgroundImage = "url('bg.jpg')";
                document.getElementById("homeContent").classList.remove("hidden");
        }
    }

    function goBack() {
        document.getElementById("menu").value = "home";
        navigate();
    }
</script>

</body></html>
