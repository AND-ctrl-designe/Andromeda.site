<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Andromeda Token</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      text-align: center;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
    }

    #main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #menu {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px;
    }

    #content {
      display: none;
      padding: 40px 20px;
      background-color: black;
      min-height: 100vh;
    }

    h1 {
      font-size: 48px;
      margin: 0;
    }

    p {
      font-size: 20px;
      margin-top: 10px;
    }

    a {
      color: #00bfff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <select id="menu" onchange="showSection(this.value)">
    <option value="">Меню</option>
    <option value="whitepaper">Бяла книга</option>
    <option value="roadmap">Пътна карта</option>
    <option value="contact">Контакт</option>
  </select>

  <div id="main-content">
    <img src="лого.png" alt="Andromeda Logo" style="max-width: 250px;">
    <h1>ANDROMEDA</h1>
    <p>The future is in your hands.</p>
  </div>

  <div id="content"></div>

  <script>
    function showSection(section) {
      const mainContent = document.getElementById('main-content');
      const content = document.getElementById('content');

      mainContent.style.display = 'none';
      content.style.display = 'block';

      if (section === 'whitepaper') {
        content.innerHTML = `
          <h2>Бяла книга</h2>
          <p><a href="Андромеда_Бяла книга.pdf" target="_blank">Изтеглете PDF</a></p>
        `;
      } else if (section === 'roadmap') {
        content.innerHTML = `
          <h2>Пътна карта</h2>
          <ul style="list-style: none; padding: 0;">
            <li><strong>Текуща фаза:</strong> Активен токен, уайтпейпър, сайт</li>
            <li><strong>Следващи стъпки:</strong> Маркетинг, листинг, партньорства</li>
          </ul>
        `;
      } else if (section === 'contact') {
        content.innerHTML = `
          <h2>Контакт</h2>
          <p>Email: andromedatoken01@gmail.com</p>
        `;
      } else {
        mainContent.style.display = 'flex';
        content.style.display = 'none';
      }
    }
  </script>

</body>
</html>
