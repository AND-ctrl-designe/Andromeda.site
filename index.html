<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andromeda Token</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      text-align: center;
    }.overlay {
  background-color: rgba(0, 0, 0, 0.65);
  min-height: 100vh;
  padding: 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
}

.menu {
  padding: 10px;
  font-size: 16px;
}

h1 {
  font-size: 48px;
  margin-top: 100px;
}

.subtitle {
  font-size: 20px;
  margin-bottom: 50px;
}

section {
  margin: 50px auto;
  max-width: 800px;
}

a {
  color: #00ccff;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

  </style>
</head>
<body>
  <div class="overlay">
    <header>
      <div></div>
      <select class="menu" onchange="navigate(this)">
        <option value="">Меню</option>
        <option value="whitepaper">Бяла книга</option>
        <option value="buy">Купи токена</option>
        <option value="roadmap">Пътна карта</option>
        <option value="contact">Контакт</option>
      </select>
    </header><main>
  <h1>АНДРОМЕДА</h1>

  <section id="whitepaper">

  </section>

    <p>Свържете се с нас на andromedatoken01@gmail.com</p>
  </section>
</main>

  </div>  <script>
    function navigate(select) {
      const value = select.value;
      if (value) {
        document.getElementById(value).scrollIntoView({ behavior: 'smooth' });
      }
      select.selectedIndex = 0;
    }
  </script></body>
</html>
