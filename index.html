<!DOCTYPE html><html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andromeda Token</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }#menu-container {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 999;
}

select {
  font-size: 16px;
  padding: 5px;
}

.section {
  display: none;
  padding: 50px 20px;
  background: rgba(0, 0, 0, 0.7);
  min-height: 100vh;
}

#home {
  display: block;
  padding-top: 100px;
}

.main-logo {
  max-width: 300px;
  height: auto;
}

.headline {
  font-size: 2.5em;
  font-weight: bold;
  margin: 0;
}

.tagline {
  font-size: 1.5em;
  margin-top: 10px;
}

  </style>
  <script>
    function showSection(id) {
      const sections = document.querySelectorAll('.section');
      sections.forEach(section => section.style.display = 'none');
      document.getElementById(id).style.display = 'block';
      if (id === 'home') {
        document.body.style.backgroundImage = "url('bg.jpg')";
      } else {
        document.body.style.backgroundImage = "url('file_0000000028f062469cd3d821e509e640.png')";
      }
    }
  </script>
</head>
<body>
  <div id="menu-container">
    <select onchange="showSection(this.value)">
      <option value="home">Меню</option>
      <option value="whitepaper">Бяла книга</option>
      <option value="contact">Контакт</option>
    </select>
  </div>  <div id="home" class="section">
    <img src="лого.png" alt="Andromeda logo" class="main-logo">
    <h1 class="headline">ANDROMEDA</h1>
    <p class="tagline">The future is in your hands.</p>
  </div>  <div id="whitepaper" class="section">
    <h2>Бяла книга</h2>
    <p><a href="Андромеда_Бяла книга.pdf" style="color:lightblue">Изтеглете PDF</a></p>
  </div>  <div id="contact" class="section">
    <h2>Контакт</h2>
    <p>Официален имейл: andromedatoken01@gmail.com</p>
  </div>
</body>
</html>
