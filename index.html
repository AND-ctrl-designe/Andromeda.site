
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda (AND)</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: #fff;
            text-align: center;
        }
        header {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            padding: 100px 20px;
        }
        header h1 {
            font-size: 3em;
            margin: 0;
        }
        header p {
            font-size: 1.5em;
            margin-top: 10px;
        }
        .founders {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        .founders img {
            width: 300px;
            height: auto;
            border-radius: 12px;
            margin: 10px;
        }
        .token {
            margin: 50px 20px;
        }
        .token h2 {
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 18px;
            color: #fff;
            background: #0066ff;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Andromeda (AND)</h1>
        <p>The future is in your hands.</p>
    </header>

    <section class="token">
        <h2>Кратка информация</h2>
        <p><strong>Мрежа:</strong> BNB Smart Chain</p>
        <p><strong>Общо количество:</strong> 200,000,000 AND</p>
        <p><strong>Търгуеми токени:</strong> 10,000,000 AND</p>
        <p><em>Целта? Ще разбереш, когато му дойде времето.</em></p>
        <a class="button" href="#">Вземи AND</a>
    </section>

    <section class="founders">
        <img src="enigma.jpg" alt="Enigma">
        <img src="mike.jpg" alt="Mike">
    </section>
</body>
</html>
