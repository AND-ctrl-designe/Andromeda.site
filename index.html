<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andromeda Token</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .banner {
      position: relative;
    }
    .banner img {
      width: 100%;
      max-height: 100vh;
      object-fit: cover;
    }
    select {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px;
      font-size: 16px;
      z-index: 10;
    }
    #content {
      padding: 20px;
      display: none;
    }
    h2 {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <select onchange="showSection(this.value)">
      <option value="">Меню</option>
      <option value="about">Относно</option>
      <option value="whitepaper">Техническа документация</option>
      <option value="roadmap">Пътна карта</option>
      <option value="invest">Инвестирайте</option>
      <option value="contact">Контакт</option>
    </select>
    <img src="лого.png" alt="Andromeda Banner">
  </div>
  <div id="content"></div>  <script>
    const sections = {
      about: `
        <h2>About the Project</h2>
        <p>Andromeda is a BEP20 token built on BNB Smart Chain with long-term goals to empower decentralized finance and community-driven governance.</p>
      `,
      whitepaper: `
        <h2>Whitepaper</h2>
        <p>Read our detailed vision and tokenomics:</p>
        <a href="Андромеда_Бяла книга.pdf" target="_blank">Download the Whitepaper (PDF)</a>
      `,
      roadmap: `
        <h2>Roadmap</h2>
        <ul>
          <li><strong>Current Stage:</strong> Token live, Whitepaper uploaded, Website launched</li>
          <li><strong>Next Steps:</strong> Promotion, Listings (GeckoTerminal, CMC), Marketing</li>
        </ul>
      `,
      invest: `
        <h2>Investors Welcome</h2>
        <p>First 10 investors get +25% bonus tokens! Your chance to join early in a fair launch.</p>
      `,
      contact: `
        <h2>Contact</h2>
        <p>Email: andromedatoken01@gmail.com</p>
      `
    };

    function showSection(section) {
      const content = document.getElementById('content');
      if (sections[section]) {
        content.innerHTML = sections[section];
        content.style.display = 'block';
      } else {
        content.innerHTML = '';
        content.style.display = 'none';
      }
    }
  </script></body>
</html>
